name: Temporary cleanup standalone model

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean unused legacy code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("NEW_model_CAPEX_separate.R")
          text = path.read_text(encoding="utf-8")

          # Remove the National Accounts import and the inactive extension placeholder.
          old_import = (
              '#National Accounts\n'
              'national_accounts <- read_xlsx("nama_10_gdp__EU27.xlsx", sheet = "Sheet 1", range = "A10:B48", col_names = F)\n\n'
              '#Here Integrate Extensions\n'
              '### maybe don\'t use that one if I us ethe exiosbase extensions\n'
              '#Employment E.G:\n'
              '#employment <- read_xlsx("nama_10_a64_EU27.xlsx", sheet = "Sheet 1", range = "A11:X77", col_names = T)\n\n'
          )
          if old_import not in text:
              raise RuntimeError("Expected legacy import block not found")
          text = text.replace(old_import, "", 1)

          # Replace the old Step 2 initialization with only the inputs that are
          # actually referenced by the active baseline and scenario model.
          start_marker = (
              '#####################################################################\n'
              '###STEP 2: Defining Coefficients (Exogenous Variables and Parameters)\n'
              '#####################################################################'
          )
          end_marker = (
              '##########################################\n'
              '###Technical coefficients matrix (A matrix)\n'
              '##########################################'
          )

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement_lines = [
              '#####################################################################',
              '### STEP 2: Construct 2023 Input-Output Baseline',
              '#####################################################################',
              '',
              '# Number of product/industry sectors in the Eurostat IO table',
              'nIndustries <- 73',
              '',
              '# Imported final consumption expenditure by product.',
              '# Used as the 2023 anchor for finished-biofuel imports.',
              't_f_e_imp <- as.numeric(',
              '  unlist(',
              '    IO_EU_imports[',
              '      2:(nIndustries + 1),',
              '      nIndustries + 3',
              '    ]',
              '  )',
              ')',
              '',
              '# Observed 2023 domestic output by sector (total supply at basic prices)',
              'q_s_dom <- as.numeric(',
              '  unlist(',
              '    IO_EU_domestic[',
              '      nIndustries + 19,',
              '      3:(nIndustries + 2)',
              '    ]',
              '  )',
              ')',
              '',
              '# Safe denominator used only for constructing technical coefficients.',
              '# Zero observed output remains zero in the actual output vector.',
              'q_s_dom_safe <- q_s_dom',
              'q_s_dom_safe[q_s_dom_safe == 0] <- 1e-6',
              '',
              '# Observed domestic government final consumption by product.',
              '# Kept fixed at 2023 levels in the current no-autonomous-growth setup.',
              'g_dom <- as.numeric(',
              '  unlist(',
              '    IO_EU_domestic[',
              '      2:(nIndustries + 1),',
              '      nIndustries + 4',
              '    ]',
              '  )',
              ')',
              '',
              '# Observed household and NPISH final consumption by product.',
              'hh_cons_dom <- as.numeric(',
              '  unlist(',
              '    IO_EU_domestic[',
              '      2:(nIndustries + 1),',
              '      nIndustries + 5',
              '    ]',
              '  )',
              ')',
              '',
              'npish_cons_dom <- as.numeric(',
              '  unlist(',
              '    IO_EU_domestic[',
              '      2:(nIndustries + 1),',
              '      nIndustries + 6',
              '    ]',
              '  )',
              ')',
              '',
              'consumption_dom <-',
              '  hh_cons_dom +',
              '  npish_cons_dom',
              '',
              '##########################################',
              '### Intermediate transaction matrices and technical coefficients',
              '##########################################',
          ]
          replacement = "\n".join(replacement_lines)
          text = text[:start] + replacement + text[end + len(end_marker):]

          # Remove the obsolete preliminary Leontief inverse, old commented
          # consistency checks and inactive extension placeholders. The active
          # model constructs the relevant Leontief inverses later.
          legacy_start = 'diag <- diag(1, nrow = nIndustries, ncol = nIndustries)'
          basic_marker = (
              '############################################################\n'
              '# 1. BASIC SETTINGS\n'
              '############################################################'
          )
          start2 = text.index(legacy_start)
          end2 = text.index(basic_marker, start2)
          text = text[:start2] + basic_marker + text[end2 + len(basic_marker):]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit cleaned model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEW_model_CAPEX_separate.R
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "Remove unused legacy initialization from standalone model"
          git push
